version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ig-postgres
    environment:
      POSTGRES_USER: iguser
      POSTGRES_PASSWORD: igpass
      POSTGRES_DB: igdownloader
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iguser -d igdownloader"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ig-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://iguser:igpass@postgres:5432/igdownloader
      DOWNLOAD_FOLDER: /data/downloads
      COOKIE_FOLDER: /data/secrets/cookies
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - downloads:/data/downloads
      - cookies:/data/secrets/cookies
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000
    container_name: ig-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000

volumes:
  pg_data:
  downloads:
  cookies:
