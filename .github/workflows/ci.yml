name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Test
        env:
          # Tests that touch cookie_vault / settings need a Fernet key.
          # A throwaway one is fine — it never leaves this runner.
          COOKIE_ENCRYPTION_KEY: ${{ secrets.COOKIE_ENCRYPTION_KEY }}
        run: python -m pytest tests/ -q
      - name: Import check (catches syntax errors in untested modules)
        run: python -c "import app.main"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: frontend
      - name: Test
        run: npm test
        working-directory: frontend
      - name: Type check
        run: npm run type-check
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend